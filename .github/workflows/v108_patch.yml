name: Apply v1.0.8 reconciliation patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v108_patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v1.0.8 patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('app.py')
          text = p.read_text()
          text = text.replace('# APP VERSION: 1.0.7', '# APP VERSION: 1.0.8')
          text = text.replace('APP_VERSION = "1.0.7"', 'APP_VERSION = "1.0.8"')

          anchor = 'ISIN_RE = re.compile(r"\\bIN[A-Z0-9]{10}\\b")\n'
          helper = (
              'ISIN_RE = re.compile(r"\\bIN[A-Z0-9]{10}\\b")\n'
              'ISIN_LINE_RE = re.compile(r"^(IN[A-Z0-9]{10})\\b\\s*(.*)$")\n\n\n'
              'def split_isin_line(line: str) -> tuple[str | None, str]:\n'
              '    """Return a leading ISIN plus any inline security-description tail."""\n'
              '    normalized = " ".join(str(line).split()).strip()\n'
              '    match = ISIN_LINE_RE.match(normalized)\n'
              '    if not match:\n'
              '        return None, ""\n'
              '    return match.group(1), match.group(2).strip()\n\n'
          )
          if 'def split_isin_line' not in text:
              if anchor not in text:
                  raise SystemExit('ISIN anchor not found')
              text = text.replace(anchor, helper, 1)

          old = (
              '        if not ISIN_RE.fullmatch(normalized):\n'
              '            i += 1\n'
              '            continue\n\n'
              '        isin = normalized\n'
              '        chunk: list[str] = []\n'
          )
          new = (
              '        isin, inline_tail = split_isin_line(normalized)\n'
              '        if not isin:\n'
              '            i += 1\n'
              '            continue\n\n'
              '        # Some CDSL PDF text layers emit ISIN and security description on one line.\n'
              '        chunk: list[str] = [inline_tail] if inline_tail else []\n'
          )
          if old in text:
              text = text.replace(old, new, 1)
          elif 'isin, inline_tail = split_isin_line(normalized)' not in text:
              raise SystemExit('ISIN record-start block not found')

          old_next = '            if ISIN_RE.fullmatch(norm_token):\n                break\n'
          new_next = '            if split_isin_line(norm_token)[0]:\n                break\n'
          if old_next in text:
              text = text.replace(old_next, new_next, 1)
          elif new_next not in text:
              raise SystemExit('next-record stop block not found')

          acct_old = '            if back_candidates:\n                current_account = back_candidates[-1]\n'
          acct_new = (
              '            if back_candidates and back_candidates[-1].upper() not in '
              '{"TOTAL", "SUB TOTAL", "GRAND TOTAL"}:\n'
              '                current_account = back_candidates[-1]\n'
          )
          if acct_old in text:
              text = text.replace(acct_old, acct_new, 1)

          doc_old = '    Every accepted row is arithmetic-validated before entering analytics.\n'
          doc_new = (
              '    Every accepted row is arithmetic-validated before entering analytics.\n'
              '    v1.0.8 also accepts rows where ISIN and description share one PDF text line.\n'
          )
          if doc_old in text and 'v1.0.8 also accepts rows' not in text:
              text = text.replace(doc_old, doc_new, 1)

          status_old = '            ["Compact cross-CAS reconciliation", "Implemented", APP_VERSION],\n'
          status_new = (
              '            ["Compact cross-CAS reconciliation", "Implemented", APP_VERSION],\n'
              '            ["Inline ISIN + security-description row recovery", "Implemented", APP_VERSION],\n'
              '            ["ACCOUNT HOLDER context hardening", "Implemented", APP_VERSION],\n'
          )
          if 'Inline ISIN + security-description row recovery' not in text:
              text = text.replace(status_old, status_new, 1)

          p.write_text(text)

          req = Path('requirements.txt')
          req.write_text(req.read_text().replace('Requirements version: 1.0.7', 'Requirements version: 1.0.8'))

          rp = Path('README.md')
          readme = rp.read_text()
          readme = readme.replace('**Repository package version:** 1.0.7', '**Repository package version:** 1.0.8')
          readme = readme.replace('## What v1.0.7 implements', '## What v1.0.8 implements')
          readme = readme.replace('No additional source files are required for v1.0.7.', 'No additional source files are required for v1.0.8.')
          readme = readme.replace('The parser in v1.0.7 is a **defensive heuristic parser**', 'The parser in v1.0.8 is a **defensive heuristic parser**')
          marker = '\n## Next version candidates\n'
          section = (
              '\n### v1.0.8 — CDSL reconciliation hardening\n\n'
              '- recovers holdings when an ISIN and security description share one PDF-extracted line\n'
              '- stops record scanning when the next line starts with another ISIN\n'
              '- avoids nearby Total/Sub Total labels replacing the account name\n'
              '- retains arithmetic validation and the strict transaction quality gate\n\n'
          )
          if '### v1.0.8 — CDSL reconciliation hardening' not in readme:
              if marker not in readme:
                  raise SystemExit('README marker not found')
              readme = readme.replace(marker, section + marker, 1)
          rp.write_text(readme)
          PY

          python -m py_compile app.py
          grep -q 'APP_VERSION = "1.0.8"' app.py
          grep -q 'def split_isin_line' app.py
          grep -q 'isin, inline_tail = split_isin_line(normalized)' app.py

      - name: Commit patched three-file build
        shell: bash
        run: |
          git config user.name "ChatGPT GitHub connector"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/v108_patch.yml
          git add app.py README.md requirements.txt
          git commit -m "Release v1.0.8 reconciliation hardening"
          git push origin HEAD:main
