name: Apply v1.0.8 reconciliation patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v108_patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v1.0.8 patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          app_path = Path('app.py')
          text = app_path.read_text()

          text = text.replace('# APP VERSION: 1.0.7', '# APP VERSION: 1.0.8')
          text = text.replace('APP_VERSION = "1.0.7"', 'APP_VERSION = "1.0.8"')

          old = 'ISIN_RE = re.compile(r"\\bIN[A-Z0-9]{10}\\b")\n'
          helper = '''ISIN_RE = re.compile(r"\\bIN[A-Z0-9]{10}\\b")
          ISIN_LINE_RE = re.compile(r"^(IN[A-Z0-9]{10})\\b\\s*(.*)$")


          def split_isin_line(line: str) -> tuple[str | None, str]:
              """
              Return an ISIN when it starts a PDF-extracted line plus any inline tail.

              Some NSDL/CDSL text layers keep the ISIN on its own line, while others
              emit ``ISIN SECURITY DESCRIPTION`` on a single line. Requiring a full
              line match silently skipped valid holdings, especially in CDSL tables.
              """
              normalized = " ".join(str(line).split()).strip()
              match = ISIN_LINE_RE.match(normalized)
              if not match:
                  return None, ""
              return match.group(1), match.group(2).strip()

          '''
          if 'def split_isin_line' not in text:
              if old not in text:
                  raise SystemExit('ISIN_RE anchor not found')
              text = text.replace(old, helper, 1)

          old_block = '''        if normalized == "ACCOUNT HOLDER":
              # Look both backward and forward for account name.
              back_candidates = []
              for k in range(max(start_idx, i - 3), i):
                  token = " ".join(lines[k].split()).strip()
                  if (
                      token
                      and token not in HOLDING_NOISE
                      and token not in {"NSDL Demat Account", "CDSL Demat Account"}
                      and not token.startswith("DP ID")
                      and "PAN:" not in token.upper()
                      and strict_numeric_token(token) is None
                  ):
                      back_candidates.append(token)
              if back_candidates:
                  current_account = back_candidates[-1]
              elif i + 1 < len(lines):
                  candidate = " ".join(lines[i + 1].split()).strip()
                  if candidate and candidate not in HOLDING_NOISE and "PAN:" not in candidate.upper():
                      current_account = candidate

          if not ISIN_RE.fullmatch(normalized):
              i += 1
              continue

          isin = normalized
          chunk: list[str] = []
          j = i + 1

          while j < len(lines) and len(chunk) < 45:
              token = lines[j].strip()
              norm_token = " ".join(token.split()).strip()
              if ISIN_RE.fullmatch(norm_token):
                  break
          '''

          new_block = '''        if normalized == "ACCOUNT HOLDER":
              # Prefer the forward token. In several CAS layouts a preceding
              # "Total"/"Sub Total" is close enough to be mistaken for a broker.
              forward_candidate = None
              for k in range(i + 1, min(len(lines), i + 4)):
                  candidate = " ".join(lines[k].split()).strip()
                  if (
                      candidate
                      and candidate not in HOLDING_NOISE
                      and candidate not in {"NSDL Demat Account", "CDSL Demat Account"}
                      and not candidate.startswith("DP ID")
                      and not candidate.startswith("Client ID")
                      and "PAN:" not in candidate.upper()
                      and strict_numeric_token(candidate) is None
                      and split_isin_line(candidate)[0] is None
                  ):
                      forward_candidate = candidate
                      break

              back_candidates = []
              for k in range(max(start_idx, i - 3), i):
                  token = " ".join(lines[k].split()).strip()
                  if (
                      token
                      and token not in HOLDING_NOISE
                      and token not in {"NSDL Demat Account", "CDSL Demat Account"}
                      and token.upper() not in {"TOTAL", "SUB TOTAL", "GRAND TOTAL"}
                      and not token.startswith("DP ID")
                      and not token.startswith("Client ID")
                      and "PAN:" not in token.upper()
                      and strict_numeric_token(token) is None
                      and split_isin_line(token)[0] is None
                  ):
                      back_candidates.append(token)

              if forward_candidate:
                  current_account = forward_candidate
              elif back_candidates:
                  current_account = back_candidates[-1]

          isin, inline_tail = split_isin_line(normalized)
          if not isin:
              i += 1
              continue

          # Preserve security/scheme description text that the PDF extractor may
          # keep on the same physical line as the ISIN.
          chunk: list[str] = [inline_tail] if inline_tail else []
          j = i + 1

          while j < len(lines) and len(chunk) < 45:
              token = lines[j].strip()
              norm_token = " ".join(token.split()).strip()
              if split_isin_line(norm_token)[0]:
                  break
          '''

          if old_block in text:
              text = text.replace(old_block, new_block, 1)
          elif 'isin, inline_tail = split_isin_line(normalized)' not in text:
              raise SystemExit('Holdings parser block not found')

          text = text.replace(
              'Every accepted row is arithmetic-validated before entering analytics.',
              'Every accepted row is arithmetic-validated before entering analytics.\\n    v1.0.8 also accepts PDF rows where an ISIN and description share one line.',
              1,
          )

          needle = '''            ["Compact cross-CAS reconciliation", "Implemented", APP_VERSION],
              ["Holdings arithmetic/reconciliation quality gate", "Implemented", APP_VERSION],
          '''
          replacement = '''            ["Compact cross-CAS reconciliation", "Implemented", APP_VERSION],
              ["Inline ISIN + security-description row recovery", "Implemented", APP_VERSION],
              ["ACCOUNT HOLDER context hardening", "Implemented", APP_VERSION],
              ["Holdings arithmetic/reconciliation quality gate", "Implemented", APP_VERSION],
          '''
          if 'Inline ISIN + security-description row recovery' not in text:
              text = text.replace(needle, replacement, 1)

          app_path.write_text(text)

          req = Path('requirements.txt').read_text().replace(
              'Requirements version: 1.0.7', 'Requirements version: 1.0.8'
          )
          Path('requirements.txt').write_text(req)

          readme_path = Path('README.md')
          readme = readme_path.read_text()
          readme = readme.replace('**Repository package version:** 1.0.7', '**Repository package version:** 1.0.8')
          readme = readme.replace('## What v1.0.7 implements', '## What v1.0.8 implements')
          readme = readme.replace('No additional source files are required for v1.0.7.', 'No additional source files are required for v1.0.8.')
          readme = readme.replace('The parser in v1.0.7 is a **defensive heuristic parser**', 'The parser in v1.0.8 is a **defensive heuristic parser**')

          marker = '\n## Next version candidates\n'
          section = '''

          ### v1.0.8 — CDSL reconciliation hardening

          - accepts holdings rows where the PDF text layer emits `ISIN + security description` on the same line
          - preserves the inline security/scheme description before numeric reconciliation
          - stops record scanning when the next line *starts* with another ISIN, not only when that line is exactly an ISIN
          - prefers the broker/account name following `ACCOUNT HOLDER` so nearby `Total`/`Sub Total` labels cannot replace the account name
          - retains arithmetic validation and does not weaken the transaction quality gate
          - specifically addresses the missing CDSL/Zerodha holdings isolated from the v1.0.7 reconciliation export
          '''
          if '### v1.0.8 — CDSL reconciliation hardening' not in readme:
              if marker not in readme:
                  raise SystemExit('README version-history marker not found')
              readme = readme.replace(marker, section + marker, 1)
          readme_path.write_text(readme)
          PY

          python -m py_compile app.py
          grep -q 'APP_VERSION = "1.0.8"' app.py
          grep -q 'def split_isin_line' app.py

      - name: Commit patched three-file build
        shell: bash
        run: |
          git config user.name "ChatGPT GitHub connector"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/v108_patch.yml
          git add app.py README.md requirements.txt
          git diff --cached --check
          git commit -m "Release v1.0.8 reconciliation hardening"
          git push origin HEAD:main
