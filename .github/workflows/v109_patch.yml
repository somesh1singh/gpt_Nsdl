name: Apply v1.0.9 reconciliation patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v109_patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v1.0.9 patch
        shell: bash
        run: |
          python .github/v109_patch.py
          python -m py_compile app.py
          grep -q 'APP_VERSION = "1.0.9"' app.py
          grep -q 'first_balance_idx' app.py
          grep -q 'CDSL numeric-tail/page-number recovery' app.py
          grep -q 'Repository package version:.*1.0.9' README.md

      - name: Commit patched three-file build
        shell: bash
        run: |
          git config user.name "ChatGPT GitHub connector"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/v109_patch.yml .github/v109_patch.py
          git add app.py README.md requirements.txt
          git commit -m "Release v1.0.9 CDSL numeric-tail hardening"
          git push origin HEAD:main
