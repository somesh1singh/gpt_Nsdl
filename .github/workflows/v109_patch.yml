name: Apply v1.0.9 CDSL numeric-tail patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v109_patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v1.0.9 patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('app.py')
          text = p.read_text()
          text = text.replace('# APP VERSION: 1.0.8', '# APP VERSION: 1.0.9')
          text = text.replace('APP_VERSION = "1.0.8"', 'APP_VERSION = "1.0.9"')

          pattern = re.compile(
              r'def find_cdsl_balance_values\(\n'
              r'    chunk: list\[str\],\n'
              r'\) -> tuple\[Decimal, Decimal, Decimal, Decimal\] \| None:\n'
              r'.*?\n\n\ndef find_mf_folio_values',
              re.S,
          )
          replacement = '''def find_cdsl_balance_values(
    chunk: list[str],
) -> tuple[Decimal, Decimal, Decimal, Decimal, int] | None:
    """
    Recover a CDSL balance-table holding from a noisy PDF text chunk.

    Canonical CDSL rows contain 11 numeric fields:
      Current Bal, Free Bal, Lent, Safekeep, Locked, Pledge Setup,
      Pledged, Earmarked, Pledgee, Market Price, Market Value.

    v1.0.8 assumed the *first* numeric token was Current Bal and the final
    two numeric tokens were Price/Value. That fails when a security description
    contains a standalone face-value number (for example "RS. 1/-") or when a
    PDF page number follows the row. v1.0.9 instead scans for the arithmetic
    identity Current Balance × Market Price ≈ Market Value and strongly prefers
    the canonical 11-field spacing. The returned index marks the true balance
    start so description numbers are retained in the security name.
    """
    nums = numeric_tokens_with_index(chunk)
    if len(nums) < 3:
        return None

    candidates: list[tuple[tuple[int, Decimal], Decimal, Decimal, Decimal, Decimal, int]] = []

    # Primary path: exact 11-field CDSL numeric tail. This safely ignores
    # description numbers before the balance block and page numbers after it.
    for start in range(0, max(0, len(nums) - 10)):
        seq = nums[start:start + 11]
        if len(seq) != 11:
            continue
        qty = abs(seq[0][1])
        market_price = abs(seq[9][1])
        market_value = abs(seq[10][1])
        if qty <= 0 or market_price <= 0 or market_value <= 0:
            continue
        err = relative_reconciliation_error(qty * market_price, market_value)
        if err <= Decimal("0.02"):
            candidates.append(
                ((0, err), qty, market_price, market_value, err, seq[0][0])
            )

    # Defensive fallback for layouts where one or more zero-balance columns are
    # omitted by the PDF text layer. Price and value must remain adjacent numeric
    # fields, and candidates closest to the canonical 9-position separation win.
    for qpos in range(len(nums)):
        qty = abs(nums[qpos][1])
        if qty <= 0:
            continue
        for ppos in range(qpos + 2, min(len(nums) - 1, qpos + 12)):
            market_price = abs(nums[ppos][1])
            market_value = abs(nums[ppos + 1][1])
            if market_price <= 0 or market_value <= 0:
                continue
            err = relative_reconciliation_error(qty * market_price, market_value)
            if err > Decimal("0.02"):
                continue
            spacing_penalty = abs((ppos - qpos) - 9)
            candidates.append(
                (
                    (spacing_penalty + 1, err),
                    qty,
                    market_price,
                    market_value,
                    err,
                    nums[qpos][0],
                )
            )

    if not candidates:
        return None

    candidates.sort(key=lambda item: item[0])
    _, qty, market_price, market_value, err, first_balance_idx = candidates[0]
    return qty, market_price, market_value, err, first_balance_idx


def find_mf_folio_values'''
          text, n = pattern.subn(replacement, text, count=1)
          if n != 1:
              raise SystemExit(f'CDSL function replacement count={n}')

          old_eq = '''            elif cdsl:
                qty, market_price, market_value, err = cdsl

                # CDSL security description is all text before first numeric balance.
                nums = numeric_tokens_with_index(chunk)
                first_numeric_idx = nums[0][0] if nums else len(chunk)
'''
          new_eq = '''            elif cdsl:
                qty, market_price, market_value, err, first_numeric_idx = cdsl

                # Use the detected balance-block start rather than the first numeric
                # token, because face-value numbers may occur inside the description.
'''
          if old_eq not in text:
              raise SystemExit('equity CDSL caller anchor not found')
          text = text.replace(old_eq, new_eq, 1)

          old_mf = '''            if cdsl and len(numeric_tokens_with_index(chunk)) >= 5:
                qty, nav, market_value, err = cdsl
                nums = numeric_tokens_with_index(chunk)
                first_numeric_idx = nums[0][0] if nums else len(chunk)
'''
          new_mf = '''            if cdsl:
                qty, nav, market_value, err, first_numeric_idx = cdsl
'''
          if old_mf not in text:
              raise SystemExit('MF CDSL caller anchor not found')
          text = text.replace(old_mf, new_mf, 1)

          text = text.replace(
              '    v1.0.8 also accepts rows where ISIN and description share one PDF text line.\n',
              '    v1.0.9 also recovers CDSL rows contaminated by description numbers or page numbers.\n',
              1,
          )

          # Surface the hardening in the in-app implementation status when the
          # existing v1.0.8 status row is present.
          status_anchor = '            ["Inline ISIN + security-description row recovery", "Implemented", APP_VERSION],\n'
          status_add = (
              status_anchor
              + '            ["CDSL numeric-tail/page-number recovery", "Implemented", APP_VERSION],\n'
          )
          if status_anchor in text and 'CDSL numeric-tail/page-number recovery' not in text:
              text = text.replace(status_anchor, status_add, 1)

          p.write_text(text)

          req = Path('requirements.txt')
          req_text = req.read_text().replace('Requirements version: 1.0.8', 'Requirements version: 1.0.9')
          req.write_text(req_text)

          rp = Path('README.md')
          readme = rp.read_text()
          readme = readme.replace('**Repository package version:** 1.0.8', '**Repository package version:** 1.0.9')
          readme = readme.replace('## What v1.0.8 implements', '## What v1.0.9 implements')
          readme = readme.replace('No additional source files are required for v1.0.8.', 'No additional source files are required for v1.0.9.')
          readme = readme.replace('The parser in v1.0.8 is a **defensive heuristic parser**', 'The parser in v1.0.9 is a **defensive heuristic parser**')
          marker = '\n## Next version candidates\n'
          section = '''
### v1.0.9 — CDSL numeric-tail and page-break hardening

- replaces the brittle first-number/last-two-number CDSL assumption with arithmetic candidate scanning
- prefers the canonical 11 numeric CDSL balance fields and validates `quantity × price ≈ value`
- ignores security-description face-value numbers when locating the true holding quantity
- ignores trailing PDF page-number contamination after a CDSL holding row
- carries the detected balance-start index into equity and demat-MF name extraction
- targets the v1.0.8 omissions seen in Oriental Aromatics, Amara Raja and page-end demat-MF rows while retaining the strict reconciliation gate

'''
          if '### v1.0.9 — CDSL numeric-tail and page-break hardening' not in readme:
              if marker not in readme:
                  raise SystemExit('README next-version marker not found')
              readme = readme.replace(marker, section + marker, 1)
          rp.write_text(readme)
          PY

          python -m py_compile app.py
          grep -q 'APP_VERSION = "1.0.9"' app.py
          grep -q 'first_balance_idx' app.py
          grep -q 'CDSL numeric-tail/page-number recovery' app.py
          grep -q 'Repository package version:.*1.0.9' README.md

      - name: Commit patched three-file build
        shell: bash
        run: |
          git config user.name "ChatGPT GitHub connector"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/v109_patch.yml
          git add app.py README.md requirements.txt
          git diff --cached --check
          git commit -m "Release v1.0.9 CDSL numeric-tail hardening"
          git push origin HEAD:main
