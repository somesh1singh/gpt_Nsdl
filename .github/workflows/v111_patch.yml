name: v1.1.1 transaction parser patch

on:
  push:
    branches: [main]
    paths:
      - '.github/v111_patch.py'
      - '.github/workflows/v111_patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/v111_patch.py
      - name: Syntax check
        run: python -m py_compile app.py
      - name: Sanity checks
        run: |
          grep -q 'APP VERSION: 1.1.1' app.py
          grep -q 'Requirements version: 1.1.1' requirements.txt
          grep -q 'Repository package version:** 1.1.1' README.md
          grep -q 'transaction text-layer hardening' README.md
      - name: Commit release and remove temporary files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py README.md requirements.txt
          git rm .github/v111_patch.py .github/workflows/v111_patch.yml
          git commit -m 'Release v1.1.1 transaction text-layer hardening'
          git push
