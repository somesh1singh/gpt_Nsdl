name: v1.1.2 cashflow semantics patch

on:
  push:
    branches: [main]
    paths:
      - '.github/v112_patch.py'
      - '.github/workflows/v112_patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair replacement escaping
        run: sed -i 's/pattern.subn(replacement, text, count=1)/pattern.subn(lambda _m: replacement, text, count=1)/g' .github/v112_patch.py
      - name: Apply patch
        run: python .github/v112_patch.py
      - name: Syntax check
        run: python -m py_compile app.py
      - name: Sanity checks
        run: |
          grep -q 'APP VERSION: 1.1.2' app.py
          grep -q 'portfolio_cashflow_inferred' app.py
          grep -q 'REVERSAL_REVIEW' app.py
          grep -q 'SWITCH_IN' app.py
          grep -q 'Requirements version: 1.1.2' requirements.txt
          grep -q '1.1.2' README.md
      - name: Commit release and remove temporary files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py README.md requirements.txt
          git rm .github/v112_patch.py .github/workflows/v112_patch.yml
          git commit -m 'Release v1.1.2 portfolio cashflow semantics hardening'
          git push
