name: v1.1.2 continuity quality hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/v112_quality_hotfix.py'
      - '.github/workflows/v112_quality_hotfix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply hotfix
        run: python .github/v112_quality_hotfix.py
      - name: Syntax and sanity
        run: |
          python -m py_compile app.py
          grep -q 'continuity_anomalies == 0' app.py
          grep -q 'Continuity anomalies' app.py
      - name: Commit and clean temporary files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          git rm -f .github/v112_quality_hotfix.py .github/workflows/v112_quality_hotfix.yml
          git commit -m 'Harden v1.1.2 continuity quality gate'
          git push
