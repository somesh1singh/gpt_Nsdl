name: Validate v1.1.10
# validation trigger: corrected dependency smoke test

on:
  push:
    branches: [v1.1.10-parser-reconciliation-hardening]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Syntax compile
        run: python -m py_compile app.py
      - name: Import smoke test
        run: python -c "import streamlit, pandas, numpy, plotly, fitz, openpyxl, requests, dateutil"
      - name: Monetary/XIRR evidence-gate tests
        run: |
          python - <<'PY'
          import ast
          from datetime import date
          from decimal import Decimal
          from pathlib import Path
          import pandas as pd

          source = Path("app.py").read_text()
          tree = ast.parse(source)
          wanted = {"D", "broker_monetary_readiness", "broker_xirr_cashflows"}
          nodes = [n for n in tree.body if isinstance(n, (ast.FunctionDef, ast.AsyncFunctionDef)) and n.name in wanted]
          found = {n.name for n in nodes}
          assert wanted <= found, f"Missing functions: {wanted-found}"
          ns = {"Any": object, "Decimal": Decimal, "date": date, "pd": pd}
          exec(compile(ast.Module(body=nodes, type_ignores=[]), "gate-test", "exec"), ns)

          def base():
              return {
                  "as_of": date(2026,9,1),
                  "trades": pd.DataFrame([{"x":1}]),
                  "ledger": pd.DataFrame([{"x":1}]),
                  "external_cashflows": pd.DataFrame([{
                      "posting_date": date(2026,1,1), "candidate_external_cashflow": Decimal("-1000"),
                      "source_file":"ledger.xlsx","source_sheet":"Sheet1","source_row":2
                  }]),
                  "rejected": pd.DataFrame(),
                  "reconciliation": pd.DataFrame([{"status":"Quantity agrees"}]),
                  "ledger_checks": pd.DataFrame([{"unlinked_rows":0}]),
                  "issues": [],
                  "opening_cash": Decimal("0"),
                  "closing_cash": Decimal("100"),
                  "holdings": pd.DataFrame([{"market_value":Decimal("1200")}]),
              }

          good=base()
          r=ns["broker_monetary_readiness"](good)
          assert r["ready"] is True
          flows=ns["broker_xirr_cashflows"](good)
          assert flows[-1] == (date(2026,9,1), Decimal("1300"))
          assert callable(ns["broker_xirr_cashflows"])

          cases = [
              ("nonzero opening", lambda x: x.update(opening_cash=Decimal("1"))),
              ("broken ledger", lambda x: x.update(ledger_checks=pd.DataFrame([{"unlinked_rows":1}]))),
              ("unresolved quantity", lambda x: x.update(reconciliation=pd.DataFrame([{"status":"Unresolved quantity"}]))),
              ("rejected row", lambda x: x.update(rejected=pd.DataFrame([{"reason":"bad"}]))),
              ("F&O gap", lambda x: x.update(issues=["Ledger includes F&O activity; derivative trades/positions are not supplied"])),
              ("corporate action gap", lambda x: x.update(issues=["corporate actions, transfers and missing history remain unverified."])),
          ]
          for name, mutate in cases:
              x=base(); mutate(x)
              rr=ns["broker_monetary_readiness"](x)
              assert rr["ready"] is False, name
              try:
                  ns["broker_xirr_cashflows"](x)
                  raise AssertionError(name+" did not block XIRR")
              except ValueError:
                  pass
          print("Monetary/XIRR gate tests passed")
          PY
      - name: Diagnostic XLSX export smoke test
        run: |
          python - <<'PY'
          import ast, io
          from pathlib import Path
          import pandas as pd
          source=Path("app.py").read_text()
          tree=ast.parse(source)
          node=next(n for n in tree.body if isinstance(n,ast.FunctionDef) and n.name=="xirr_diagnostic_workbook")
          ns={"pd":pd,"io":io,"Any":object,"APP_VERSION":"1.1.5"}
          exec(compile(ast.Module(body=[node],type_ignores=[]),"diag-test","exec"),ns)
          result={"reconciliation":pd.DataFrame([{"status":"Unresolved exception","isin":"TEST"}]),
                  "rejected":pd.DataFrame([{"reason":"duplicate"}]),
                  "ledger_checks":pd.DataFrame([{"unlinked_rows":0}]),
                  "trades":pd.DataFrame([{"symbol":"NIFTY26SEPFUT","strike":22500.0,"option_type":None}]),
                  "issues":["corporate actions/transfers remain unverified"],
                  "as_of":"2026-09-16","opening_cash":0,"closing_cash":100}
          readiness={"ready":False,"gates":pd.DataFrame([{"gate":"Test","status":"BLOCK","evidence":"fixture"}]),
                     "cashflows":pd.DataFrame([{"date":"2022-01-01","cashflow":-5000}])}
          data=ns["xirr_diagnostic_workbook"](result,readiness)
          book=pd.ExcelFile(io.BytesIO(data))
          expected={"Summary_Gates","Unresolved_Reconciliation","Rejected_Rows","FO_Reconciliation","Corporate_Actions","External_Cashflows","Ledger_Checks","Holdings_Reconciliation","XIRR_Cashflows","XIRR_Result"}
          assert expected <= set(book.sheet_names)
          print("Diagnostic XLSX export passed")
          PY
      - name: F&O no-ISIN regression guard
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path("app.py").read_text()
          assert '"DERIV:" + symbol' in s
          assert 'no accepted derivative trade evidence' in s
          assert 'segment in ("FO", "F&O", "NFO")' in s
          print("F&O no-ISIN regression guard passed")
          PY
      - name: Multi-period tradebook parser regression
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path("app.py").read_text()
          assert "Tradebook(?: Statement)?" in s
          assert "is_repeated_header" in s
          assert "Each section must carry its own stated period" in s
          print("Multi-period parser regression guard passed")
          PY
      - name: Streamlit headless startup
        run: |
          timeout 30s streamlit run app.py --server.headless true --server.port 8501 > streamlit.log 2>&1 &
          PID=$!
          for i in {1..25}; do
            if curl -fsS http://127.0.0.1:8501/_stcore/health | grep -q ok; then
              kill $PID || true
              exit 0
            fi
            sleep 1
          done
          cat streamlit.log
          kill $PID || true
          exit 1
