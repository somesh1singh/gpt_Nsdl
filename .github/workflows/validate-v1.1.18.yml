name: Validate v1.1.18

on:
  pull_request:
    branches: [main]
  push:
    branches: [v1.1.18-nonblocking-multi-isin]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Syntax compile
        run: python -m py_compile app.py _app_core_v115.py resolution_ledger.py
      - name: Official NSE action normalization regression
        run: |
          python - <<'PY'
          from datetime import date
          import resolution_ledger as rl

          class FakeResponse:
              def __init__(self, data): self._data = data
              def raise_for_status(self): return None
              def json(self): return self._data
          class FakeSession:
              def __init__(self): self.headers = self
              def update(self, *_a, **_k): pass
              def get(self, url, params=None, timeout=None):
                  if params is None: return FakeResponse([])
                  return FakeResponse([
                      {"symbol":"BONUSCO","comp":"Bonus Co","series":"EQ","subject":"Bonus 3:1","exDate":"25-May-2024","recDate":"25-May-2024"},
                      {"symbol":"BONUSCO","subject":"Rights 10:51","exDate":"13-Aug-2024","recDate":"13-Aug-2024"},
                  ])
          original = rl.requests.Session
          rl.requests.Session = FakeSession
          rl._NSE_ACTION_CACHE.clear()
          try:
              rows = rl.fetch_nse_corporate_actions(["BONUSCO"], date(2024,1,1), date(2024,12,31))
          finally:
              rl.requests.Session = original
          assert len(rows) == 2, rows
          bonus = next(r for r in rows if r["action_type"] == "BONUS")
          assert bonus["bonus_numerator"] == 3 and bonus["bonus_denominator"] == 1
          assert bonus["verification_level"] == "EXTERNAL_NSE_VERIFIED"
          assert any(r["action_type"] == "RIGHTS" for r in rows)
          print("official NSE action normalization regression passed")
          PY
      - name: Bonus chronology exact-resolution regression
        run: |
          python - <<'PY'
          from datetime import date
          from decimal import Decimal
          from resolution_ledger import apply_audited_resolution_ledger

          rec = [{
              "asset_class":"Equity","symbol":"BONUSCO","isin":"INE000A01001",
              "in_holdings":True,"net_trade_quantity":Decimal("456"),"reported_quantity":Decimal("600"),
              "difference":Decimal("144"),"status":"Unresolved quantity","exception_class":"Trade/holding quantity gap","basis":"raw"
          }]
          trades = [
              {"asset_class":"Equity","symbol":"BONUSCO","trade_date":date(2024,1,10),"signed_quantity":Decimal("48")},
              {"asset_class":"Equity","symbol":"BONUSCO","trade_date":date(2024,6,10),"signed_quantity":Decimal("408")},
          ]
          actions = [{
              "symbol":"BONUSCO","action_type":"BONUS","ex_date":date(2024,5,25),"record_date":date(2024,5,25),
              "effective_date":date(2024,5,25),"bonus_numerator":Decimal("3"),"bonus_denominator":Decimal("1"),
              "verification_level":"EXTERNAL_NSE_VERIFIED","subject":"Bonus 3:1","source":"NSE","source_url":"https://www.nseindia.com/companies-listing/corporate-filings-actions"
          }]
          out, _, ledger = apply_audited_resolution_ledger(rec, [], [], trades=trades, corporate_actions=actions)
          assert out[0]["status"] == "Quantity agrees", out
          assert out[0]["resolution_rule"] == "EXTERNAL_NSE_BONUS_CHRONOLOGY"
          item = next(r for r in ledger if r["rule"] == "EXTERNAL_NSE_BONUS_CHRONOLOGY")
          assert item["total_bonus_credit"] == Decimal("144"), item
          assert item["verification_level"] == "EXTERNAL_NSE_VERIFIED"
          print("bonus chronology exact-resolution regression passed")
          PY
      - name: Multiple bonus chronology regression
        run: |
          python - <<'PY'
          from datetime import date
          from decimal import Decimal
          from resolution_ledger import apply_audited_resolution_ledger

          # 100 shares -> 1:2 bonus adds 50; sell 110 -> 40; second 1:2 adds 20; buy 40 -> 100.
          # Net accepted trades = 30, total bonus credits = 70, ending holding = 100.
          rec = [{
              "asset_class":"Equity","symbol":"MULTIBONUS","isin":"INE000A01002",
              "in_holdings":True,"net_trade_quantity":Decimal("30"),"reported_quantity":Decimal("100"),
              "difference":Decimal("70"),"status":"Unresolved quantity","exception_class":"Trade/holding quantity gap","basis":"raw"
          }]
          trades = [
              {"asset_class":"Equity","symbol":"MULTIBONUS","trade_date":date(2024,1,1),"signed_quantity":Decimal("100")},
              {"asset_class":"Equity","symbol":"MULTIBONUS","trade_date":date(2024,3,1),"signed_quantity":Decimal("-110")},
              {"asset_class":"Equity","symbol":"MULTIBONUS","trade_date":date(2025,2,1),"signed_quantity":Decimal("40")},
          ]
          actions = [
              {"symbol":"MULTIBONUS","action_type":"BONUS","ex_date":date(2024,2,15),"effective_date":date(2024,2,15),"bonus_numerator":Decimal("1"),"bonus_denominator":Decimal("2"),"verification_level":"EXTERNAL_NSE_VERIFIED"},
              {"symbol":"MULTIBONUS","action_type":"BONUS","ex_date":date(2025,1,3),"effective_date":date(2025,1,3),"bonus_numerator":Decimal("1"),"bonus_denominator":Decimal("2"),"verification_level":"EXTERNAL_NSE_VERIFIED"},
          ]
          out, _, ledger = apply_audited_resolution_ledger(rec, [], [], trades=trades, corporate_actions=actions)
          assert out[0]["status"] == "Quantity agrees", out
          item = next(r for r in ledger if r["rule"] == "EXTERNAL_NSE_BONUS_CHRONOLOGY")
          assert item["total_bonus_credit"] == Decimal("70") and item["bonus_events"] == 2, item
          print("multiple bonus chronology regression passed")
          PY
      - name: Corporate action safety regressions
        run: |
          python - <<'PY'
          from datetime import date
          from decimal import Decimal
          from resolution_ledger import apply_audited_resolution_ledger

          base = {"asset_class":"Equity","symbol":"SAFETY","isin":"INE000A01003","in_holdings":True,
                  "net_trade_quantity":Decimal("100"),"reported_quantity":Decimal("150"),"difference":Decimal("50"),
                  "status":"Unresolved quantity","exception_class":"Trade/holding quantity gap","basis":"raw"}
          trades = [{"asset_class":"Equity","symbol":"SAFETY","trade_date":date(2024,1,1),"signed_quantity":Decimal("100")}]
          bad_bonus = [{"symbol":"SAFETY","action_type":"BONUS","ex_date":date(2024,2,1),"effective_date":date(2024,2,1),
                        "bonus_numerator":Decimal("1"),"bonus_denominator":Decimal("3"),"verification_level":"EXTERNAL_NSE_VERIFIED"}]
          out, _, ledger = apply_audited_resolution_ledger([base], [], [], trades=trades, corporate_actions=bad_bonus)
          assert out[0]["status"] == "Unresolved quantity" and not ledger

          rights = [{"symbol":"SAFETY","action_type":"RIGHTS","ex_date":date(2024,2,1),"effective_date":date(2024,2,1),
                     "verification_level":"EXTERNAL_NSE_VERIFIED"}]
          out, _, ledger = apply_audited_resolution_ledger([base], [], [], trades=trades, corporate_actions=rights)
          assert out[0]["status"] == "Unresolved quantity" and not ledger

          good_bonus = [{"symbol":"SAFETY","action_type":"BONUS","ex_date":date(2024,2,1),"effective_date":date(2024,2,1),
                         "bonus_numerator":Decimal("1"),"bonus_denominator":Decimal("2"),"verification_level":"EXTERNAL_NSE_VERIFIED"}]
          out, _, ledger = apply_audited_resolution_ledger([base], [], [{"symbol":"SAFETY","reason":"conflict"}], trades=trades, corporate_actions=good_bonus)
          assert out[0]["status"] == "Unresolved quantity" and not ledger
          print("corporate-action safety regressions passed")
          PY
      - name: Multi-ISIN blocking regression
        run: |
          python - <<'PY'
          import pandas as pd
          from resolution_ledger import corporate_resolution_status

          agreed = pd.DataFrame([
              {"asset_class":"Equity","symbol":"HIST","status":"Quantity agrees","exception_class":"Quantity agrees"},
              {"asset_class":"Equity","symbol":"HIST","status":"Quantity agrees","exception_class":"Quantity agrees"},
          ])
          blocked, evidence = corporate_resolution_status({"reconciliation":agreed,"resolution_ledger":pd.DataFrame(),
              "identifier_review":pd.DataFrame(),"issues":["Symbol HIST has multiple ISINs: A, B"]})
          assert blocked is False, evidence
          assert "1 historical multi-ISIN warning(s) non-blocking" in evidence, evidence

          unresolved = pd.DataFrame([{"asset_class":"Equity","symbol":"LIVE","status":"Unresolved quantity","exception_class":"Trade/holding quantity gap"}])
          blocked, evidence = corporate_resolution_status({"reconciliation":unresolved,"resolution_ledger":pd.DataFrame(),
              "identifier_review":pd.DataFrame(),"issues":["Symbol LIVE has multiple ISINs: A, B"]})
          assert blocked is True and "1 blocking multi-ISIN warning(s)" in evidence, evidence
          print("multi-ISIN blocking regression passed")
          PY
      - name: Version and integration regression
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('app.py').read_text()
          assert 'APP_VERSION = "1.1.18"' in s
          assert 'fetch_nse_corporate_actions' in s
          assert 'Corporate_Action_Evidence' in s
          assert 'EXTERNAL_NSE_BONUS_CHRONOLOGY' in s
          print('v1.1.18 integration anchors present')
          PY
      - name: Streamlit headless startup
        run: |
          timeout 30s streamlit run app.py --server.headless true --server.port 8501 > /tmp/streamlit.log 2>&1 || code=$?
          if [ "${code:-0}" -ne 0 ] && [ "${code:-0}" -ne 124 ]; then cat /tmp/streamlit.log; exit "$code"; fi
          if grep -q "Traceback" /tmp/streamlit.log; then cat /tmp/streamlit.log; exit 1; fi
