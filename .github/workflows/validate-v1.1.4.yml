name: Validate v1.1.4

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Syntax compile
        run: python -m py_compile app.py
      - name: Import smoke test
        run: python -c "import streamlit, pandas, numpy, scipy, plotly, fitz, openpyxl, yfinance"
      - name: Streamlit headless startup
        run: |
          timeout 30s streamlit run app.py --server.headless true --server.port 8501 > streamlit.log 2>&1 &
          PID=$!
          for i in {1..25}; do
            if curl -fsS http://127.0.0.1:8501/_stcore/health | grep -q ok; then
              kill $PID || true
              exit 0
            fi
            sleep 1
          done
          cat streamlit.log
          kill $PID || true
          exit 1
